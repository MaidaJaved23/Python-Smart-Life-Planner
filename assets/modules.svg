<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Segoe UI,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2DF5A8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="gcv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ggv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2DF5A8"/></linearGradient>
<linearGradient id="gpv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".07"/></pattern>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pls{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(580px)}}
@keyframes gxl{0%{transform:scaleX(0)}12%{transform:scaleX(1)}90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes gyl{0%{transform:scaleY(0)}12%{transform:scaleY(1)}90%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}
@keyframes lbl{0%,10%{opacity:0}16%,88%{opacity:1}95%,100%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:flt 5s ease-in-out infinite}
.pl{animation:pls 2.4s ease-in-out infinite}
.dash{stroke-dasharray:8 8;animation:dash 1.4s linear infinite}
.scan{animation:scan 7s linear infinite}
.bx{transform-box:fill-box;transform-origin:left center;animation:gxl 9s cubic-bezier(.2,.8,.2,1) infinite}
.by{transform-box:fill-box;transform-origin:center bottom;animation:gyl 9s cubic-bezier(.2,.8,.2,1) infinite}
.lb{animation:lbl 9s ease infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}
.bl{animation:blink 1s steps(2) infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
</style>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="22" fill="url(#grid)"/>
<circle cx="211" cy="353" r="1.5" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-0.02s;animation-duration:5.0s"/><circle cx="957" cy="256" r="1.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-3.28s;animation-duration:4.7s"/><circle cx="889" cy="349" r="2" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-3.36s;animation-duration:4.5s"/><circle cx="344" cy="101" r="1.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-0.25s;animation-duration:4.0s"/><circle cx="855" cy="271" r="3" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-0.26s;animation-duration:6.3s"/><circle cx="295" cy="537" r="2.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-4.77s;animation-duration:7.9s"/><circle cx="656" cy="423" r="1.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-0.00s;animation-duration:6.2s"/><circle cx="792" cy="531" r="2" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-0.50s;animation-duration:4.8s"/><circle cx="409" cy="138" r="2.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-1.18s;animation-duration:4.1s"/><circle cx="58" cy="240" r="2.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-1.71s;animation-duration:5.9s"/><circle cx="123" cy="28" r="1.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-3.10s;animation-duration:7.0s"/><circle cx="335" cy="195" r="2.5" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-2.78s;animation-duration:6.5s"/><circle cx="132" cy="383" r="3" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-1.45s;animation-duration:5.9s"/><circle cx="544" cy="434" r="1.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-0.52s;animation-duration:7.2s"/>
<g class="r"><rect x="380" y="36" width="440" height="78" rx="18" fill="#0A1636" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="1.5"/><text x="600" y="70" font-size="22" font-weight="800" fill="#E8EEFF" text-anchor="middle">main.py · SmartLifePlanner</text><text x="600" y="96" font-size="13" font-weight="400" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">terminal menu-driven CLI</text></g><path d="M500 114C500 160 310 150 310 214" fill="none" stroke="#9B7BFF" stroke-width="2" stroke-opacity="0.8" class="dash"/><path d="M700 114C700 160 890 150 890 214" fill="none" stroke="#2DF5A8" stroke-width="2" stroke-opacity="0.8" class="dash"/><circle r="4" fill="#9B7BFF" filter="url(#gl)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M500 114C500 160 310 150 310 214"/></circle><circle r="4" fill="#2DF5A8" filter="url(#gl)"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M700 114C700 160 890 150 890 214"/></circle><g class="r" style="animation-delay:0.4s"><rect x="40" y="214" width="540" height="280" rx="22" fill="#0C1330" stroke="#9B7BFF" stroke-opacity="0.8" stroke-width="1.5"/><rect x="40" y="214" width="540" height="6" rx="3" fill="#9B7BFF" opacity=".85"/><text x="70" y="262" font-size="26" font-weight="800" fill="#E8EEFF" text-anchor="start">Pakistan Trip Planner</text><text x="70" y="288" font-size="14" font-weight="400" fill="#9B7BFF" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">Cost it. Check it. Optimize it.</text><circle cx="78" cy="330" r="5" fill="#9B7BFF" class="pl" style="animation-delay:0.0s"/><text x="96" y="335" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Cost by travellers, rooms, days, tier</text><circle cx="78" cy="366" r="5" fill="#9B7BFF" class="pl" style="animation-delay:0.4s"/><text x="96" y="371" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">5% buffer · within / exact / over budget</text><circle cx="78" cy="402" r="5" fill="#9B7BFF" class="pl" style="animation-delay:0.8s"/><text x="96" y="407" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Optimizer: 6 dimensions, all re-costed</text><circle cx="78" cy="438" r="5" fill="#9B7BFF" class="pl" style="animation-delay:1.2000000000000002s"/><text x="96" y="443" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Non-destructive modify · cancel keeps plan</text></g><g class="r" style="animation-delay:0.7s"><rect x="620" y="214" width="540" height="280" rx="22" fill="#0C1330" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><rect x="620" y="214" width="540" height="6" rx="3" fill="#2DF5A8" opacity=".85"/><text x="650" y="262" font-size="26" font-weight="800" fill="#E8EEFF" text-anchor="start">Monthly Budget Manager</text><text x="650" y="288" font-size="14" font-weight="400" fill="#2DF5A8" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">Plan it. Track it. Report it.</text><circle cx="658" cy="330" r="5" fill="#2DF5A8" class="pl" style="animation-delay:0.0s"/><text x="676" y="335" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Home &amp; Kitchen / Personal Finance</text><circle cx="658" cy="366" r="5" fill="#2DF5A8" class="pl" style="animation-delay:0.4s"/><text x="676" y="371" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Custom categories + expense log</text><circle cx="658" cy="402" r="5" fill="#2DF5A8" class="pl" style="animation-delay:0.8s"/><text x="676" y="407" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Category and overall overspend flags</text><circle cx="658" cy="438" r="5" fill="#2DF5A8" class="pl" style="animation-delay:1.2000000000000002s"/><text x="676" y="443" font-size="16" font-weight="400" fill="#E8EEFF" text-anchor="start">Net savings rate · confirmed PDF export</text></g><path d="M310 494V520" fill="none" stroke="#9B7BFF" stroke-width="2" stroke-opacity="0.8" class="dash"/><path d="M890 494V520" fill="none" stroke="#2DF5A8" stroke-width="2" stroke-opacity="0.8" class="dash"/><g class="r" style="animation-delay:1.2s"><rect x="40" y="522" width="1120" height="40" rx="12" fill="#0A1230" stroke="#FFC857" stroke-opacity="0.7" stroke-width="1.5"/><text x="600" y="548" font-size="14" font-weight="700" fill="#FFC857" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">JSON persistence   ·   ReportLab PDF reports   ·   Pytest suite (104 tests)</text></g>
<rect class="scan" x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity=".14"/>
<rect x="1" y="1" width="1198" height="578" rx="21" fill="none" stroke="#22D3EE" stroke-opacity=".25"/>
</svg>