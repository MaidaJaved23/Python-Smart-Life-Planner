-dasharray="4 6"/><text x="78" y="220.0" font-size="11" font-weight="400" fill="#8A96C0" text-anchor="end" font-family="Consolas,'SFMono-Regular','Courier New',monospace">40,000</text><line x1="90" y1="160.0" x2="960" y2="160.0" stroke="#22D3EE" stroke-opacity=".12" stroke-dasharray="4 6"/><text x="78" y="164.0" font-size="11" font-weight="400" fill="#8A96C0" text-anchor="end" font-family="Consolas,'SFMono-Regular','Courier New',monospace">50,000</text><rect class="by" x="180" y="328.0" width="70" height="112.0" rx="8" fill="url(#gcv)" style="animation-delay:0.00s" filter="url(#gl)"/><rect class="by" x="270" y="294.4" width="70" height="145.6" rx="8" fill="url(#gpv)" style="animation-delay:0.12s" filter="url(#gl)"/><text x="215" y="318.0" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.0s">20,000</text><text x="305" y="284.4" font-size="12" font-weight="700" fill="#FF4D8D" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.12s">26,000</text><text x="260" y="470" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="middle">Electricity</text><text x="260" y="494" font-size="12" font-weight="700" fill="#FF4D8D" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.3s">Overspent by PKR 6,000</text><rect class="by" x="480" y="188.0" width="70" height="252.0" rx="8" fill="url(#gcv)" style="animation-delay:0.25s" filter="url(#gl)"/><rect class="by" x="570" y="204.8" width="70" height="235.2" rx="8" fill="url(#ggv)" style="animation-delay:0.37s" filter="url(#gl)"/><text x="515" y="178.0" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.25s">45,000</text><text x="605" y="194.8" font-size="12" font-weight="700" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.37s">42,000</text><text x="560" y="470" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="middle">Grocery</text><text x="560" y="494" font-size="12" font-weight="700" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.55s">Within budget · PKR 3,000 left</text><rect class="by" x="780" y="412.0" width="70" height="28.0" rx="8" fill="url(#gcv)" style="animation-delay:0.50s" filter="url(#gl)"/><rect class="by" x="870" y="412.0" width="70" height="28.0" rx="8" fill="url(#ggv)" style="animation-delay:0.62s" filter="url(#gl)"/><text x="815" y="402.0" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.5s">5,000</text><text x="905" y="402.0" font-size="12" font-weight="700" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.62s">5,000</text><text x="860" y="470" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="middle">Internet</text><text x="860" y="494" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" class="lb" style="animation-delay:0.8s">Exactly on budget</text>
