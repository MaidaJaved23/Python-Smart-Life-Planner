<text x="40" y="40" font-size="22" font-weight="800" fill="#E8EEFF" text-anchor="start">System design flow</text><g class="r" style="animation-delay:0.00s"><rect x="570.0" y="30" width="160" height="40" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="650" y="56.0" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">START</text></g><g class="r" style="animation-delay:0.20s"><rect x="430.0" y="108" width="440" height="60" rx="14" fill="#101A3E" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/><text x="650" y="132" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Main menu  ·  python main.py</text><text x="650" y="150" font-size="11" font-weight="400" fill="#22D3EE" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">1 Trip Planner · 2 Budget Manager · 4 Developer Info</text></g><g class="r" style="animation-delay:0.40s"><rect x="110.0" y="240" width="300" height="50" rx="14" fill="#101A3E" stroke="#9B7BFF" stroke-opacity="0.8" stroke-width="1.5"/><text x="260" y="264" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Enter trip details</text><text x="260" y="282" font-size="11" font-weight="400" fill="#9B7BFF" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">validated · nights &lt;= days</text></g><g class="r" style="animation-delay:0.55s"><rect x="110.0" y="330" width="300" height="50" rx="14" fill="#101A3E" stroke="#9B7BFF" stroke-opacity="0.8" stroke-width="1.5"/><text x="260" y="354" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Calculate cost</text><text x="260" y="372" font-size="11" font-weight="400" fill="#9B7BFF" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">rooms · tier · +5% buffer</text></g><g class="r" style="animation-delay:.8s"><polygon points="260,397 380,445 260,493 140,445" fill="#101A3E" stroke="#FFC857" stroke-width="1.5" stroke-opacity=".9"/><text x="260" y="451" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Within budget?</text></g><g class="r" style="animation-delay:1.00s"><rect x="110.0" y="540" width="300" height="50" rx="14" fill="#101A3E" stroke="#9B7BFF" stroke-opacity="0.8" stroke-width="1.5"/><text x="260" y="564" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Day-wise itinerary</text><text x="260" y="582" font-size="11" font-weight="400" fill="#9B7BFF" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">adaptive to days and nights</text></g><g class="r" style="animation-delay:1.15s"><rect x="110.0" y="630" width="300" height="50" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="260" y="654" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Confirm  →  save JSON</text><text x="260" y="672" font-size="11" font-weight="400" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">then PDF report</text></g><g class="r" style="animation-delay:1.00s"><rect x="470.0" y="420" width="240" height="50" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.8" stroke-width="1.5"/><text x="590" y="444" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Optimizer: ranked options</text><text x="590" y="462" font-size="11" font-weight="400" fill="#FF4D8D" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">re-costed · 0 false positives</text></g><g class="r" style="animation-delay:0.90s"><rect x="470.0" y="330" width="240" height="50" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.8" stroke-width="1.5"/><text x="590" y="354" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Modify plan (clone)</text><text x="590" y="372" font-size="11" font-weight="400" fill="#FF4D8D" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">cancel keeps the original</text></g><g class="r" style="animation-delay:0.40s"><rect x="890.0" y="240" width="300" height="50" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="1040" y="264" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Choose template</text><text x="1040" y="282" font-size="11" font-weight="400" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">Home &amp; Kitchen · Personal Finance</text></g><g class="r" style="animation-delay:0.55s"><rect x="890.0" y="330" width="300" height="50" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="1040" y="354" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Set planned amounts</text><text x="1040" y="372" font-size="11" font-weight="400" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">custom categories</text></g><g class="r" style="animation-delay:0.70s"><rect x="890.0" y="420" width="300" height="50" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="1040" y="444" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Record expenses</text><text x="1040" y="462" font-size="11" font-weight="400" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">ID · category · amount · date</text></g><g class="r" style="animation-delay:0.85s"><rect x="890.0" y="510" width="300" height="50" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="1040" y="534" font-size="16" font-weight="700" fill="#E8EEFF" text-anchor="middle">Analyze</text><text x="1040" y="552" font-size="11" font-weight="400" fill="#2DF5A8" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace">overspend flags · savings rate</text></g><g class="r