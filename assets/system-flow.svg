<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" font-family="Segoe UI,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2DF5A8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="gcv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ggv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2DF5A8"/></linearGradient>
<linearGradient id="gpv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".07"/></pattern>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pls{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(760px)}}
@keyframes gxl{0%{transform:scaleX(0)}12%{transform:scaleX(1)}90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes gyl{0%{transform:scaleY(0)}12%{transform:scaleY(1)}90%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}
@keyframes lbl{0%,10%{opacity:0}16%,88%{opacity:1}95%,100%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:flt 5s ease-in-out infinite}
.pl{animation:pls 2.4s ease-in-out infinite}
.dash{stroke-dasharray:8 8;animation:dash 1.4s linear infinite}
.scan{animation:scan 7s linear infinite}
.bx{transform-box:fill-box;transform-origin:left center;animation:gxl 9s cubic-bezier(.2,.8,.2,1) infinite}
.by{transform-box:fill-box;transform-origin:center bottom;animation:gyl 9s cubic-bezier(.2,.8,.2,1) infinite}
.lb{animation:lbl 9s ease infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}
.bl{animation:blink 1s steps(2) infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
</style>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="22" fill="url(#grid)"/>
