" y="150" width="440" height="48" rx="12" fill="#0C1330" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/><circle cx="548" cy="174" r="8" fill="#22D3EE" class="pl"/><text x="570" y="180" font-size="16" font-weight="600" fill="#E8EEFF" text-anchor="start">Transportation</text><text x="940" y="172" font-size="16" font-weight="800" fill="#22D3EE" text-anchor="end">16.8%</text><text x="940" y="190" font-size="11" font-weight="400" fill="#8A96C0" text-anchor="end" font-family="Consolas,'SFMono-Regular','Courier New',monospace">PKR 6,000</text></g><g class="r" style="animation-delay:0.55s"><rect x="520" y="212" width="440" height="48" rx="12" fill="#0C1330" stroke="#2DF5A8" stroke-opacity="0.6" stroke-width="1.5"/><circle cx="548" cy="236" r="8" fill="#2DF5A8" class="pl"/><text x="570" y="242" font-size="16" font-weight="600" fill="#E8EEFF" text-anchor="start">Accommodation</text><text x="940" y="234" font-size="16" font-weight="800" fill="#2DF5A8" text-anchor="end">28.0%</text><text x="940" y="252" font-size="11" font-weight="400" fill="#8A96C0" text-anchor="end" font-family="Consolas,'SFMono-Regular','Courier New',monospace">PKR 10,000</text></g><g class="r" style="animation-delay:0.70s"><rect x="520" y="274" width="440" height="48" rx="12" fill="#0C1330" stroke="#FFC857" stroke-opacity="0.6" stroke-width="1.5"/><circle cx="548" cy="298" r="8" fill="#FFC857" class="pl"/><text x="570" y="304" font-size="16" font-weight="600" fill="#E8EEFF" text-anchor="start">Food &amp; Dining</text><text x="940" y="296" font-size="16" font-weight="800" fill="#FFC857" text-anchor="end">33.6%</text><text x="940" y="314" font-size="11" font-weight="400" fill="#8A96C0" text-anchor="end" font-family="Consolas,'SFMono-Regular','Courier New',monospace">PKR 12,000</text></g><g class="r" style="animation-delay:0.85s"><rect x="520" y="336" width="440" height="48" rx="12" fill="#0C1330" stroke="#FF4D8D" stroke-opacity="0.6" stroke-width="1.5"/><circle cx="548" cy="360" r="8" fill="#FF4D8D