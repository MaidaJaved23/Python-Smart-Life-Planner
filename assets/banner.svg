<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2DF5A8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="gcv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ggv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2DF5A8"/></linearGradient>
<linearGradient id="gpv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".07"/></pattern>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pls{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(420px)}}
@keyframes gxl{0%{transform:scaleX(0)}12%{transform:scaleX(1)}90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes gyl{0%{transform:scaleY(0)}12%{transform:scaleY(1)}90%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}
@keyframes lbl{0%,10%{opacity:0}16%,88%{opacity:1}95%,100%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:flt 5s ease-in-out infinite}
.pl{animation:pls 2.4s ease-in-out infinite}
.dash{stroke-dasharray:8 8;animation:dash 1.4s linear infinite}
.scan{animation:scan 7s linear infinite}
.bx{transform-box:fill-box;transform-origin:left center;animation:gxl 9s cubic-bezier(.2,.8,.2,1) infinite}
.by{transform-box:fill-box;transform-origin:center bottom;animation:gyl 9s cubic-bezier(.2,.8,.2,1) infinite}
.lb{animation:lbl 9s ease infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}
.bl{animation:blink 1s steps(2) infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
</style>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="22" fill="url(#grid)"/>
<circle cx="1175" cy="238" r="2" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-2.62s;animation-duration:7.3s"/><circle cx="462" cy="214" r="1.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-4.91s;animation-duration:7.4s"/><circle cx="1175" cy="247" r="3" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-4.12s;animation-duration:7.1s"/><circle cx="221" cy="247" r="2" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-1.18s;animation-duration:5.4s"/><circle cx="805" cy="197" r="1.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-2.71s;animation-duration:5.6s"/><circle cx="562" cy="271" r="1.5" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-1.67s;animation-duration:4.5s"/><circle cx="1134" cy="368" r="3" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-4.19s;animation-duration:6.4s"/><circle cx="188" cy="66" r="3" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-3.80s;animation-duration:5.0s"/><circle cx="21" cy="180" r="2.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-0.61s;animation-duration:7.1s"/><circle cx="916" cy="186" r="2" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-4.71s;animation-duration:5.9s"/><circle cx="419" cy="163" r="3" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-1.97s;animation-duration:6.9s"/><circle cx="489" cy="83" r="2" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-2.53s;animation-duration:4.4s"/><circle cx="191" cy="346" r="2" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-0.24s;animation-duration:5.1s"/><circle cx="268" cy="137" r="3" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-3.27s;animation-duration:5.0s"/>
<ellipse cx="220" cy="120" rx="260" ry="140" fill="#22D3EE" opacity=".16" filter="url(#bl)"/><ellipse cx="980" cy="330" rx="260" ry="140" fill="#FF4D8D" opacity=".14" filter="url(#bl)"/><rect x="60" y="48" width="372" height="34" rx="17" fill="none" stroke="#22D3EE" stroke-opacity=".7"/><text x="80" y="70" font-size="12" font-weight="700" fill="#22D3EE" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="1.4">PYTHON CLI  ·  PAKISTAN TRIPS  ·  BUDGETS</text><text x="60" y="160" font-size="70" font-weight="800" fill="#E8EEFF" text-anchor="start" class="r" style="animation-delay:0.1s">Smart Life</text><text x="60" y="232" font-size="70" font-weight="800" fill="url(#gt)" class="r" style="animation-delay:.3s">Planner</text><rect x="345" y="185" width="7" height="50" fill="#22D3EE" class="bl"/><text x="60" y="272" font-size="22" font-weight="400" fill="#8A96C0" text-anchor="start" class="r" style="animation-delay:0.6s">Pakistan Trip Planner &amp; Monthly Budget Manager</text><g class="r" style="animation-delay:0.9s"><rect x="60" y="308" width="160" height="66" rx="14" fill="#0E1632" stroke="#FF4D8D" stroke-opacity="0.8" stroke-width="1.5"/><text x="76" y="331" font-size="11" font-weight="700" fill="#FF4D8D" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="1">MODULES</text><text x="76" y="358" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start">2 in one CLI</text></g><g class="r" style="animation-delay:1.1s"><rect x="240" y="308" width="180" height="66" rx="14" fill="#0E1632" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/><text x="256" y="331" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="1">DESTINATIONS</text><text x="256" y="358" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start">9+ across PK</text></g><g class="r" style="animation-delay:1.3s"><rect x="440" y="308" width="170" height="66" rx="14" fill="#0E1632" stroke="#2DF5A8" stroke-opacity="0.8" stroke-width="1.5"/><text x="456" y="331" font-size="11" font-weight="700" fill="#2DF5A8" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="1">PYTEST</text><text x="456" y="358" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start">104 passing</text></g><g class="fl" style="animation-duration:7s"><rect x="690" y="48" width="450" height="330" rx="20" fill="#0A1230" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/><circle cx="716" cy="76" r="6" fill="#FF4D8D"/><circle cx="736" cy="76" r="6" fill="#FFC857"/><circle cx="756" cy="76" r="6" fill="#2DF5A8"/><text x="780" y="80" font-size="13" font-weight="400" fill="#8A96C0" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">smart-life-planner — live run</text><g class="r" style="animation-delay:1.0s"><rect x="710" y="104" width="410" height="72" rx="14" fill="#0E1838" stroke="#2DF5A8" stroke-opacity="0.55" stroke-width="1.5"/><text x="730" y="134" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="start">Trip cost + 5% emergency buffer</text><text x="730" y="158" font-size="13" font-weight="400" fill="#2DF5A8" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">PKR 35,700.00 · Within budget</text><circle cx="1084" cy="140" r="18" fill="#2DF5A8" opacity=".18" class="pl"/><circle cx="1084" cy="140" r="14" fill="none" stroke="#2DF5A8" stroke-width="2"/><path d="M1078 140 L1082 145 L1091 134" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="r" style="animation-delay:1.5s"><rect x="710" y="192" width="410" height="72" rx="14" fill="#0E1838" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/><text x="730" y="222" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="start">Optimizer re-costs every option</text><text x="730" y="246" font-size="13" font-weight="400" fill="#22D3EE" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">0 false positives · ranked by score</text><circle cx="1084" cy="228" r="18" fill="#22D3EE" opacity=".18" class="pl"/><circle cx="1084" cy="228" r="14" fill="none" stroke="#22D3EE" stroke-width="2"/><path d="M1078 228 L1082 233 L1091 222" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="r" style="animation-delay:2.0s"><rect x="710" y="280" width="410" height="72" rx="14" fill="#0E1838" stroke="#FF4D8D" stroke-opacity="0.55" stroke-width="1.5"/><text x="730" y="310" font-size="17" font-weight="700" fill="#E8EEFF" text-anchor="start">PDF report after confirmation</text><text x="730" y="334" font-size="13" font-weight="400" fill="#FF4D8D" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace">Developer footer on every page</text><circle cx="1084" cy="316" r="18" fill="#FF4D8D" opacity=".18" class="pl"/><circle cx="1084" cy="316" r="14" fill="none" stroke="#FF4D8D" stroke-width="2"/><path d="M1078 316 L1082 321 L1091 310" fill="none" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<rect class="scan" x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity=".14"/>
