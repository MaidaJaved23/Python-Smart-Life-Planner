<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2DF5A8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
<linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="gcv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="ggv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2DF5A8"/></linearGradient>
<linearGradient id="gpv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".07"/></pattern>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pls{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(600px)}}
@keyframes gxl{0%{transform:scaleX(0)}12%{transform:scaleX(1)}90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes gyl{0%{transform:scaleY(0)}12%{transform:scaleY(1)}90%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}
@keyframes lbl{0%,10%{opacity:0}16%,88%{opacity:1}95%,100%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{animation:flt 5s ease-in-out infinite}
.pl{animation:pls 2.4s ease-in-out infinite}
.dash{stroke-dasharray:8 8;animation:dash 1.4s linear infinite}
.scan{animation:scan 7s linear infinite}
.bx{transform-box:fill-box;transform-origin:left center;animation:gxl 9s cubic-bezier(.2,.8,.2,1) infinite}
.by{transform-box:fill-box;transform-origin:center bottom;animation:gyl 9s cubic-bezier(.2,.8,.2,1) infinite}
.lb{animation:lbl 9s ease infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}
.bl{animation:blink 1s steps(2) infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
</style>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
<rect width="100%" height="100%" rx="22" fill="url(#grid)"/>
<circle cx="665" cy="300" r="2" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-4.24s;animation-duration:5.7s"/><circle cx="468" cy="230" r="2" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-0.34s;animation-duration:7.1s"/><circle cx="1177" cy="208" r="2" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-0.64s;animation-duration:4.0s"/><circle cx="812" cy="353" r="1.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-1.28s;animation-duration:4.9s"/><circle cx="145" cy="327" r="2.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-1.58s;animation-duration:5.5s"/><circle cx="102" cy="271" r="2.5" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-1.54s;animation-duration:6.1s"/><circle cx="476" cy="494" r="1.5" fill="#9B7BFF" opacity=".55" class="fl" style="animation-delay:-0.43s;animation-duration:7.3s"/><circle cx="312" cy="499" r="1.5" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-3.04s;animation-duration:6.7s"/><circle cx="439" cy="397" r="2.5" fill="#22D3EE" opacity=".55" class="fl" style="animation-delay:-2.18s;animation-duration:4.8s"/><circle cx="385" cy="169" r="2.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-4.85s;animation-duration:4.7s"/><circle cx="174" cy="412" r="2.5" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-3.14s;animation-duration:6.8s"/><circle cx="304" cy="397" r="2" fill="#2DF5A8" opacity=".55" class="fl" style="animation-delay:-2.12s;animation-duration:5.0s"/><circle cx="522" cy="425" r="1.5" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-4.85s;animation-duration:6.4s"/><circle cx="159" cy="468" r="1.5" fill="#FF4D8D" opacity=".55" class="fl" style="animation-delay:-4.88s;animation-duration:7.0s"/>
<text x="600" y="62" font-size="30" font-weight="800" fill="#E8EEFF" text-anchor="middle">Manual planning  vs  Smart Life Planner</text><rect x="450" y="74" width="300" height="4" rx="2" fill="url(#gt)" class="pl"/><g class="r" style="animation-delay:0.1s"><rect x="40" y="110" width="520" height="460" rx="22" fill="#0C1330" stroke="#FF4D8D" stroke-opacity="0.7" stroke-width="1.5"/><text x="70" y="156" font-size="16" font-weight="800" fill="#FF4D8D" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="2">MANUAL PLANNING</text><rect x="70" y="168" width="60" height="3" rx="2" fill="#FF4D8D"/></g><g class="r" style="animation-delay:0.50s"><rect x="60" y="196" width="480" height="56" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="92" cy="224" r="16" fill="#FF4D8D" opacity=".16"/><path d="M86 218 L98 230 M98 218 L86 230" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/><text x="124" y="230" font-size="17" font-weight="400" fill="#8A96C0" text-anchor="start">Guess hotel, food and transport costs</text></g><g class="r" style="animation-delay:0.75s"><rect x="60" y="268" width="480" height="56" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="92" cy="296" r="16" fill="#FF4D8D" opacity=".16"/><path d="M86 290 L98 302 M98 290 L86 302" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/><text x="124" y="302" font-size="17" font-weight="400" fill="#8A96C0" text-anchor="start">Forget the emergency buffer</text></g><g class="r" style="animation-delay:1.00s"><rect x="60" y="340" width="480" height="56" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="92" cy="368" r="16" fill="#FF4D8D" opacity=".16"/><path d="M86 362 L98 374 M98 362 L86 374" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/><text x="124" y="374" font-size="17" font-weight="400" fill="#8A96C0" text-anchor="start">Learn you are over budget too late</text></g><g class="r" style="animation-delay:1.25s"><rect x="60" y="412" width="480" height="56" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="92" cy="440" r="16" fill="#FF4D8D" opacity=".16"/><path d="M86 434 L98 446 M98 434 L86 446" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/><text x="124" y="446" font-size="17" font-weight="400" fill="#8A96C0" text-anchor="start">Overspending hidden in a notebook</text></g><g class="r" style="animation-delay:1.50s"><rect x="60" y="484" width="480" height="56" rx="14" fill="#101A3E" stroke="#FF4D8D" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="92" cy="512" r="16" fill="#FF4D8D" opacity=".16"/><path d="M86 506 L98 518 M98 506 L86 518" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/><text x="124" y="518" font-size="17" font-weight="400" fill="#8A96C0" text-anchor="start">Retype everything into a report</text></g><g class="r" style="animation-delay:0.3s"><rect x="640" y="110" width="520" height="460" rx="22" fill="#0C1330" stroke="#2DF5A8" stroke-opacity="0.7" stroke-width="1.5"/><text x="670" y="156" font-size="16" font-weight="800" fill="#2DF5A8" text-anchor="start" font-family="Consolas,'SFMono-Regular','Courier New',monospace" letter-spacing="2">SMART LIFE PLANNER</text><rect x="670" y="168" width="60" height="3" rx="2" fill="#2DF5A8"/></g><g class="r" style="animation-delay:0.60s"><rect x="660" y="196" width="480" height="56" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="692" cy="224" r="16" fill="#2DF5A8" opacity=".16"/><path d="M686 224 L690 229 L699 218" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="230" font-size="17" font-weight="600" fill="#E8EEFF" text-anchor="start">Costs by travellers, rooms, days and tier</text></g><g class="r" style="animation-delay:0.85s"><rect x="660" y="268" width="480" height="56" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="692" cy="296" r="16" fill="#2DF5A8" opacity=".16"/><path d="M686 296 L690 301 L699 290" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="302" font-size="17" font-weight="600" fill="#E8EEFF" text-anchor="start">Automatic 5% emergency allowance</text></g><g class="r" style="animation-delay:1.10s"><rect x="660" y="340" width="480" height="56" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="692" cy="368" r="16" fill="#2DF5A8" opacity=".16"/><path d="M686 368 L690 373 L699 362" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="374" font-size="17" font-weight="600" fill="#E8EEFF" text-anchor="start">Optimizer offers re-costed affordable options</text></g><g class="r" style="animation-delay:1.35s"><rect x="660" y="412" width="480" height="56" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="692" cy="440" r="16" fill="#2DF5A8" opacity=".16"/><path d="M686 440 L690 445 L699 434" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="446" font-size="17" font-weight="600" fill="#E8EEFF" text-anchor="start">Category and overall overspend flags</text></g><g class="r" style="animation-delay:1.60s"><rect x="660" y="484" width="480" height="56" rx="14" fill="#101A3E" stroke="#2DF5A8" stroke-opacity="0.45" stroke-width="1.5"/><circle cx="692" cy="512" r="16" fill="#2DF5A8" opacity=".16"/><path d="M686 512 L690 517 L699 506" fill="none" stroke="#2DF5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="518" font-size="17" font-weight="600" fill="#E8EEFF" text-anchor="start">PDF report once you confirm</text></g><g class="pl"><circle cx="600" cy="340" r="36" fill="url(#gt)" filter="url(#gl)"/></g><text x="600" y="347" font-size="22" font-weight="900" fill="#070B1A" text-anchor="middle">VS</text><path d="M560 340H520" fill="none" stroke="#FF4D8D" stroke-width="2" stroke-opacity="0.8" class="dash"/><path d="M640 340H680" fill="none" stroke="#2DF5A8" stroke-width="2" stroke-opacity="0.8" class="dash"/>
<rect class="scan" x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity=".14"/>
<rect x="1" y="1" width="1198" height="598" rx="21" fill="none" stroke="#22D3EE" stroke-opacity=".25"/>
</svg>